<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Orbit — study in your own universe. An intelligent study planner and progress tracker." />
    <meta name="theme-color" content="#0B1020" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Orbit — study in your own universe</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var ui = JSON.parse(localStorage.getItem('orbit.ui') || '{}');
        var t = ui && ui.state && ui.state.theme;
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
